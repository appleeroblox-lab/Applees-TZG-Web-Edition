<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Zero Gravity Web Studio</title>
<link rel="stylesheet" href="/entry-menu.css">
<link rel="stylesheet" href="/ui-theme.css">
<link rel="stylesheet" href="/home-experiment.css">
<style>
  @font-face{font-family:Fredoka;src:url('/fonts/FredokaOne-Regular.ttf')}
  [hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#0e2443;color:#fff;font:16px Fredoka,system-ui,sans-serif}
  main{margin:auto;padding:24px;max-width:1400px}section,header{padding:16px;border:1px solid #a3ceff;border-radius:12px;background:#173961}
  form{display:grid;gap:12px;max-width:420px;margin:12vh auto}button,input,select{font:inherit;color:inherit;background:#244c79;border:1px solid #b6d9ff;border-radius:8px;padding:8px}
  button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid white}
  a{color:#a3ceff}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.panels{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3fr) minmax(150px,1fr);gap:10px}
  .panels label{display:grid;gap:5px;margin:10px 0}.panels input,.panels select{width:100%}canvas{display:block;max-width:100%;touch-action:none}.viewport{min-height:360px}
  main{max-width:none;padding:0}#workspace{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
  #workspace .studioRibbon{background:#12243b;border:0;border-bottom:1px solid #456383;border-radius:0;padding:0;margin:0}
  .studioTitle{background:#203751;padding:6px 12px;font-size:14px}.studioTitle span{margin-left:8px;color:#a3c9ed;font-size:12px}
  #workspace .studioRibbon .tools{padding:5px 10px;margin:0;gap:5px}
  #workspace .panels{min-height:0;grid-template-columns:clamp(113px,18vw,235px) minmax(0,1fr) clamp(145px,23vw,275px);gap:4px;padding:4px}
  #workspace .panels section,.outputPane{min-width:0;border:1px solid #4a698a;border-radius:4px;background:#172d46;overflow:auto;padding:0}
  #workspace h2{margin:0;padding:5px 8px;border-bottom:1px solid #4a698a;background:#223b57;font-size:13px}
  #workspace .panels label{margin:6px 8px;font-size:11px;gap:2px}
  #workspace .panels input,#workspace .panels select{font-size:12px;padding:3px 4px;border-radius:4px}
  .inspector{min-height:0;display:grid;grid-template-rows:minmax(78px,1fr) minmax(92px,1fr);gap:4px}
  #workspace .viewport{min-height:0;overflow:hidden;background:#102544}.viewport canvas{width:100%}
  #draft{margin:0;padding:0 0 6px}#draft button{margin:0 8px;font-size:11px;padding:4px}
  #workspace .tools button{padding:4px 8px;border-radius:4px;font-size:12px}
  .outputPane{margin:0 4px 4px;max-height:24dvh}.outputPane p{margin:4px 8px;font:12px system-ui,sans-serif}
  .outputPane #versions{padding:3px 8px}.outputPane #versions button{font-size:11px;padding:3px 6px}
  #accountGate,#boot,#unlockScreen{position:fixed;inset:0;z-index:10}
  #accountGate,#unlockScreen{display:grid;place-items:center;overflow:auto}
  #unlockScreen{background:#06152c url('/images/entry/background.png') center/cover}
  #accountGate form,#unlockScreen form,#accountGate .studioWelcome{position:relative;z-index:2;margin:auto;padding:16px;width:min(460px,94vw);text-align:center}
  #accountGate .studioWelcome{display:grid;gap:12px}#accountGate .studioWelcome button{background:#fff;color:#102544;border:2px solid #91bded;border-radius:10px}
  #accountGate .studioWelcome img{width:20px;height:20px;vertical-align:middle;margin-right:6px}
  #accountGate h1,#unlockScreen h1{font-weight:400;margin:0 0 8px;font-size:clamp(22px,4.5vw,42px)}
  #accountGate h1 small,#unlockScreen h1 small{display:block;font-size:.55em}
  #notice{position:fixed;z-index:30;bottom:4px;left:50%;translate:-50% 0;margin:0;padding:6px 12px;border-radius:8px;background:#0a1e38;max-width:90vw;text-align:center}
  #notice:empty{display:none}#boot[hidden]{display:none!important}#boot{z-index:20}
  #boot .bootProgressTrack{position:relative;background:#0b2645;border:2px solid #90c7fa;overflow:hidden}
  #sourceProgress{height:100%;background:#3b8ddd}#sourceDetail{position:absolute;top:calc(50% + 70px);left:5%;width:90%;text-align:center}
  @media(orientation:portrait){main{visibility:hidden!important;pointer-events:none!important}}
  @media(max-height:440px){#workspace .panels label{margin:3px 6px}#accountGate .studioWelcome{gap:6px}}
  #startupLandscape[open]{place-content:center!important;place-items:center!important;text-align:center}
  #startupLandscape .landscapeCard{margin:auto!important;max-height:100%;overflow:auto}
  #workspace .studioRibbon{background:#174d7c;border-color:#a1d8ff}.studioTitle{background:#14395f}
  #workspace .panels section,.outputPane{border-color:#88bce8;background:#173c62}#workspace h2{background:#205883;border-color:#88bce8}
  .studioFile{position:relative;font-size:13px}.studioFile summary{cursor:pointer;border:1px solid #a7d3f8;border-radius:4px;padding:4px 10px}
  .studioFile>div{position:absolute;top:100%;left:0;z-index:8;min-width:145px;background:#174d7c;padding:6px;border:1px solid #9ed5ff;border-radius:6px}
  .studioFile button{display:block;width:100%;text-align:left;margin:3px 0}
  #update-info{color:white;background:#174b76;border:2px solid #a0d5ff;border-radius:12px;width:min(460px,92vw)}
  #update-info::backdrop{background:#071e38aa}#update-info label{display:grid;gap:4px;margin:10px 0}
  #update-info textarea{min-height:60px;font:inherit}
  .viewport:has(iframe){display:grid;grid-template-rows:auto minmax(0,1fr) auto}
  .studioUiFrame{overflow:auto;min-width:0;min-height:0}
  .viewport iframe{display:block;border:0;width:100%;height:100%;background:#102544}
  #workspace .viewport .studioUiTools{display:flex;flex-wrap:wrap;align-items:end;border-width:1px 0 0;gap:4px;padding:4px}
  #workspace .studioUiTools label{min-width:46px;max-width:120px;margin:0}.studioUiTools .tools{margin:0}
  #workspace .studioPaint{padding:8px;background:#2378ae}
  #workspace .studioPaint .homePickerTop{cursor:default;touch-action:auto}
  .studioSwatches{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}
  .studioSwatches button{min-height:24px;padding:0}.studioPaint .homeGradientTrack button{position:absolute;bottom:-8px;transform:translateX(-50%);width:16px;height:18px;padding:0;touch-action:none}
  .studioPaint .homeGradientTrack [aria-pressed=true]{outline:2px solid #0d345d}
  #workspace{grid-template-rows:auto minmax(0,1fr)}
  #workspace .panels{position:relative;isolation:isolate;overflow:hidden;gap:0;padding:0;
    grid-template-columns:var(--dock-left,0px) minmax(0,1fr) var(--dock-right,0px);
    grid-template-rows:var(--dock-top,0px) minmax(0,1fr) var(--dock-bottom,0px)}
  .studioDock{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;gap:3px;padding:3px}
  .studioDock[data-side=left]{grid-area:2 / 1}.studioDock[data-side=right]{grid-area:2 / 3}
  .studioDock[data-side=top]{grid-area:1 / 1 / 2 / 4}.studioDock[data-side=bottom]{grid-area:3 / 1 / 4 / 4}
  .studioDock[data-side=top],.studioDock[data-side=bottom]{flex-direction:row}
  .studioAxisOverlay{position:absolute;inset:0;pointer-events:none}
  .studioAxisOverlay span{position:absolute;transform:translate(-50%,-50%);font-size:11px;text-shadow:1px 1px #07172b}
  #workspace .viewport{position:relative;grid-area:2 / 2;min-width:0;border-radius:0}
  .studioFloatLayer{position:absolute;inset:0;z-index:3;pointer-events:none}
  .studioWindow{position:relative;display:flex;flex:1 1 0;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:#173c62;border:1px solid #88bce8;border-radius:7px}
  .studioFloatLayer .studioWindow{position:absolute;pointer-events:auto;box-shadow:0 10px 22px #091a30a8}
  .studioWindowBar{display:flex;align-items:center;flex:none;background:#205883;border-bottom:1px solid #88bce8;user-select:none}
  .studioWindowBar button{box-sizing:border-box;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;cursor:grab;touch-action:none;border:0;border-radius:0;padding:5px 7px;background:transparent}
  .studioWindowBar button[aria-pressed=true]{background:#3377a8}
  .studioWindowBar button:last-child{flex:none;margin-left:auto;cursor:pointer}
  .studioWindowBody{flex:1 1 auto;min-height:0;overflow:auto}
  #workspace .studioPanelBody{border:0;border-radius:0;max-height:none;margin:0}
  .studioSplitter,.studioResize{position:absolute;z-index:2;touch-action:none;user-select:none}
  .studioSplitter:is([data-side=left],[data-side=right]),.studioResize:is([data-edge=e],[data-edge=w]){top:0;bottom:0;width:8px;cursor:ew-resize}
  .studioSplitter:is([data-side=top],[data-side=bottom]),.studioResize:is([data-edge=n],[data-edge=s]){left:0;right:0;height:8px;cursor:ns-resize}
  .studioSplitter[data-side=left],.studioResize[data-edge=e]{right:0}.studioSplitter[data-side=right],.studioResize[data-edge=w]{left:0}
  .studioSplitter[data-side=top],.studioResize[data-edge=s]{bottom:0}.studioSplitter[data-side=bottom],.studioResize[data-edge=n]{top:0}
  .studioResize:is([data-edge=nw],[data-edge=ne],[data-edge=sw],[data-edge=se]){width:10px;height:10px}
  .studioResize[data-edge=nw]{top:0;left:0;cursor:nwse-resize}.studioResize[data-edge=ne]{top:0;right:0;cursor:nesw-resize}
  .studioResize[data-edge=sw]{bottom:0;left:0;cursor:nesw-resize}.studioResize[data-edge=se]{bottom:0;right:0;cursor:nwse-resize}
  .studioDockPreview,.studioDragGhost{position:absolute;z-index:5;pointer-events:none;border:2px solid #a3dbff;border-radius:6px;background:#448ed477}
  .studioDragGhost{z-index:4;background:#203d62bb;padding:5px;font-size:12px}
  .studioGroupSplitter{flex:0 0 5px;touch-action:none;background:#294f74;border-radius:3px}
  .studioGroupSplitter[data-orientation=vertical]{cursor:ns-resize}
  .studioGroupSplitter[data-orientation=horizontal]{cursor:ew-resize}
  .studioGesture iframe{pointer-events:none}
  .studioGesture,.studioGesture *{user-select:none!important}
  #workspace .studioRibbon{z-index:7}
  #workspace #model-tools{padding:0;gap:3px}
  #workspace #model-tools button[aria-pressed=true],#workspace #grid[aria-pressed=true]{background:#338bc0}
  #transform-fields fieldset{display:flex;gap:2px;margin:5px 6px;padding:2px;border:1px solid #6194bb}
  #transform-fields legend{font-size:11px;padding:0 3px}
  #workspace #transform-fields label{min-width:0;margin:2px;flex:1}
  #workspace .studioVisibility{display:flex;align-items:center}
  #workspace #part-visible{width:auto}

  #workspace #view-panels button[aria-pressed=true]::before{content:'✓ ';color:#c3eaff}
</style>
<main>

<p id="notice" role="status"></p>
<div id="accountGate" hidden>
  <div class="studioWelcome" id="signinChoices">
    <h1>The Zero Gravity<small>Web Studio</small></h1>
    <button id="accountGoogle" type="button"><img src="/images/entry/google.png" alt="">Sign in with Google</button>
    <button id="accountEmailLogin" type="button">Sign in with game account</button>
  </div>
  <form id="gameLogin" hidden>
    <h1>Sign in<small>The Zero Gravity Web Studio</small></h1>
    <label for="gameIdentifier">Email or username</label>
    <input id="gameIdentifier" autocomplete="username" required>
    <label for="gamePassword">Game account password</label>
    <input id="gamePassword" type="password" autocomplete="current-password" maxlength="128" required>
    <button>Sign in</button>
    <button id="signInBack" type="button">Back</button>
  </form>
</div>
<div id="unlockScreen" hidden>
  <form id="unlock">
    <h1>The Zero Gravity<small>Web Studio</small></h1>
    <label for="password">Studio password</label>
    <input id="password" type="password" autocomplete="off" required minlength="12" maxlength="72">
    <button value="open">Unlock Studio</button>
    <button value="setup">Set initial Studio password</button>
    <button id="signOut" type="button">Sign out</button>
  </form>
</div>
<div id="boot" hidden><div class="bootCard">
  <h1 class="bootTitle">The Zero Gravity<span>Web Studio</span></h1>
  <div class="bootProgressRow"><div class="bootProgressTrack"><div id="sourceProgress"></div><strong id="sourcePercent"></strong></div></div>
  <p id="bootStatus" role="status"></p><small id="sourceDetail"></small>
</div></div>
<div id="workspace" hidden></div>
</main>
<script nonce="__STUDIO_NONCE__" type="module">
const sessionKey = 'tzg-studio-game-session-v1';
const gate = document.querySelector('#accountGate');
const unlockScreen = document.querySelector('#unlockScreen');
const gameLogin = document.querySelector('#gameLogin');
const choices = document.querySelector('#signinChoices');
const boot = document.querySelector('#boot');
const landscape = matchMedia('(orientation: landscape)');
const { installStartupLandscape } = await import('/startup-landscape.js');
const rotation = installStartupLandscape();
if (!document.querySelector('#startupLandscape')) {
  const dialog = document.createElement('dialog');
  dialog.id = 'startupLandscape';
  dialog.setAttribute('aria-label', 'Landscape orientation');
  dialog.style.cssText = 'position:fixed!important;inset:0!important;margin:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;z-index:2147483647!important;padding:24px!important;box-sizing:border-box!important;border:0!important;border-radius:0!important;background:#090b10!important;color:#fff!important';
  dialog.innerHTML = '<div class="landscapeCard"><svg class="landscapeArtwork" viewBox="0 0 120 100" aria-hidden="true"><rect x="28" y="29" width="68" height="42" rx="7" fill="none" stroke="currentColor" stroke-width="4"/><path d="M16 46a39 39 0 0 1 62-30M78 6v12H66M104 54a39 39 0 0 1-62 30M42 94V82h12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Rotate to landscape</h1><p>Turn your phone sideways for the best flight experience.</p><button type="button" class="primary">Enter landscape</button><small>Keep your device sideways to continue.</small></div>';
  document.body.append(dialog);
  const refresh = () => {
    if (landscape.matches) { dialog.close(); dialog.hidden = true; }
    else { dialog.hidden = false; if (!dialog.open) dialog.showModal(); }
  };
  dialog.querySelector('button').onclick = async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
      await screen.orientation?.lock?.('landscape');
    } catch {}
    refresh();
  };
  dialog.addEventListener('cancel', event => event.preventDefault());
  landscape.addEventListener('change', refresh);
  refresh();
} else {
  rotation.refresh();
}

const gameSessionKey = 'tzg-player-session-v1';
let clientPromise;
function client() {
  clientPromise ??= Promise.all([
    import('/vendor/supabase.js?v=62'),
    import('/supabase-config.js'),
  ]).then(([{ createClient }, { supabaseConfig }]) =>
    createClient(supabaseConfig.url, supabaseConfig.publishableKey, {
      auth: { storageKey: sessionKey, persistSession: true, flowType: 'pkce', detectSessionInUrl: true },
    }));
  return clientPromise;
}
function loading(percent, status, detail = '') {
  boot.hidden = false;
  document.querySelector('#sourceProgress').style.width = percent + '%';
  document.querySelector('#sourcePercent').textContent = (percent === 100 ? 'Ready' : 'Preparing') + ' · ' + percent + '%';
  document.querySelector('#bootStatus').textContent = status;
  document.querySelector('#sourceDetail').textContent = detail;
}
function showSignedIn(signedIn) {
  gate.hidden = signedIn;
  unlockScreen.hidden = !signedIn;
  boot.hidden = true;
}
document.querySelector('#accountEmailLogin').onclick = () => {
  if (!landscape.matches) return;
  choices.hidden = true;
  gameLogin.hidden = false;
  document.querySelector('#gameIdentifier').focus();
};
document.querySelector('#signInBack').onclick = () => {
  gameLogin.hidden = true;
  choices.hidden = false;
  notices.textContent = '';
};
document.querySelector('#accountGoogle').onclick = async event => {
  if (!landscape.matches) return;
  event.currentTarget.disabled = true;
  const button = event.currentTarget;
  try {
    loading(15, 'Opening Google sign-in…');
    const { error } = await (await client()).auth.signInWithOAuth({
      provider: 'google', options: { redirectTo: location.origin + '/studio/', queryParams: { prompt: 'select_account' } },
    });
    if (error) throw error;
  } catch (error) {
    boot.hidden = true;
    notices.textContent = error.message;
    button.disabled = false;
  }
};
gameLogin.onsubmit = async event => {
  event.preventDefault();
  if (!landscape.matches) return;
  const identifier = document.querySelector('#gameIdentifier').value.trim();
  const field = document.querySelector('#gamePassword');
  const password = field.value;
  field.value = '';
  const submit = event.submitter;
  submit.disabled = true;
  try {
    loading(25, 'Signing in…');
    const authClient = await client();
    const { accountEndpoint } = await import('/account-auth-flow.js');
    let result;
    if (identifier.includes('@')) {
      result = await authClient.auth.signInWithPassword({ email: identifier, password });
    } else {
      const data = await accountEndpoint(authClient, 'login', { identifier, password });
      result = await authClient.auth.setSession(data.session);
    }
    if (result.error) throw result.error;
    notices.textContent = '';
    showSignedIn(Boolean(result.data.session));
  } catch (error) {
    boot.hidden = true;
    notices.textContent = error.message || 'Could not sign in. Check your account details.';
  } finally { submit.disabled = false; }
};
document.querySelector('#signOut').onclick = async () => {
  const authClient = await client();
  await lock();
  await authClient.auth.signOut({ scope: 'local' });
  showSignedIn(false);
  choices.hidden = false;
  gameLogin.hidden = true;
  notices.textContent = '';
};
const form = document.querySelector('#unlock');
const passwordInput = document.querySelector('#password');
const notices = document.querySelector('#notice');
const root = document.querySelector('#workspace');
let studioToken;
let timeout;
let cleanup;

function session() {
  try { return JSON.parse(localStorage.getItem(sessionKey))?.access_token; }
  catch { return null; }
}
async function call(action, args, raw = false) {
  const auth = session();
  if (!auth) throw new Error('Sign in to your TZG game account first.');
  const result = await fetch('/studio/api/' + action, {
    method: 'POST', headers: { Authorization: 'Bearer ' + auth, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!result.ok) throw new Error('Studio request failed (' + result.status + ').');
  return raw ? result.text() : result.json();
}
async function lock() {
  const token = studioToken;
  studioToken = undefined;
  clearTimeout(timeout);
  cleanup?.();
  cleanup = undefined;
  root.replaceChildren();
  root.hidden = true;
  unlockScreen.hidden = !session();
  gate.hidden = Boolean(session());
  notices.textContent = 'Studio is locked.';
  if (token) await call('lock', { token }).catch(() => {});
}
function idle() {
  clearTimeout(timeout);
  if (studioToken) timeout = setTimeout(lock, 10 * 60 * 1000);
}
window.addEventListener('storage', event => {
  if ((event.key === sessionKey && !session()) || (event.key === gameSessionKey && !event.newValue && event.oldValue)) void lock();
});
root.addEventListener('pointerdown', idle);
root.addEventListener('keydown', idle);
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!landscape.matches) return;
  const password = passwordInput.value;
  passwordInput.value = '';
  event.submitter.disabled = true;
  try {
    if (event.submitter.value === 'setup') {
      const ok = await call('setup', { password });
      notices.textContent = ok ? 'Password set. Enter it again to unlock.' : 'Initial setup is unavailable for this account.';
      return;
    }
    loading(15, 'Verifying Studio access…');
    studioToken = await call('open', { password });
    if (!studioToken) {
      notices.textContent = 'Studio access denied.';
      return;
    }
    const token = studioToken;
    loading(45, 'Loading Studio files…');
    const source = await call('editor', { token }, true);
    const moduleUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
    try {
      const editor = await import(moduleUrl);
      loading(80, 'Preparing the 3D viewport…');
      cleanup = await editor.mount(root, {
        call: async (action, args = {}) => {
          if (studioToken !== token) throw new Error('Studio is locked.');
          const data = await call(action, { ...args, token });
          if (data?.status === 'locked') void lock();
          return data;
        },
        lock, message: text => { notices.textContent = text; },
      });
    } finally { URL.revokeObjectURL(moduleUrl); }
    loading(100, 'Studio ready');
    unlockScreen.hidden = true;
    root.hidden = false;
    window.dispatchEvent(new Event('resize'));
    notices.textContent = '';
    idle();
  } catch (error) {
    if (studioToken) await lock();
    notices.textContent = error.message;
  } finally { boot.hidden = true; event.submitter.disabled = false; }
});
loading(1, 'Connecting to your account…');
try {
  const authClient = await client();
  const { data, error } = await authClient.auth.getSession();
  if (error) notices.textContent = error.message;
  showSignedIn(Boolean(data?.session));
  authClient.auth.onAuthStateChange((event, nextSession) => {
    if (event === 'SIGNED_OUT' || !nextSession) {
      void lock();
      showSignedIn(false);
    }
  });
} catch (error) {
  notices.textContent = 'Could not connect to the account service. ' + error.message;
  showSignedIn(false);
}
</script>
</html>
